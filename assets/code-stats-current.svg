<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 -16 928 643" width="928" height="643" role="img" aria-labelledby="t d">
<title id="t">Machtiani code statistics by repository</title>
<desc id="d">The umbrella repository contains 19,486 of the 240,890 lines of source in the four repositories. Together they contain 67 percent Go, 16 percent TypeScript, 10 percent Shell, and 5 percent Python. machtiani-harness: 118,831 lines; Dear Machine: 62,160 lines; dearmachine-concierge: 40,413 lines; machtiani (root repo): 19,486 lines.</desc>
